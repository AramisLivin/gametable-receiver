<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>GameTable</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Nunito:wght@800;900&family=Russo+One&display=swap" rel="stylesheet">

</head>
<body>
<div class="half half-left"></div>
<div class="half half-right"></div>
<div id="join">
  <div id="join-pass">
    <div id="join-caption"></div>
    <div id="join-qr"></div>
    <div id="join-stub">
      <div id="join-code-label"></div>
      <div id="join-code"></div>
    </div>
  </div>
</div>
<div id="home" class="screen">
  <div id="home-text">
    <h1>GameTable</h1>
    <p id="home-tag"></p>
    <p id="waiting"></p>
  </div>
  <div id="home-fan"></div>
</div>
<div id="lobby" class="screen">
  <div id="menu-backdrops"></div>
  <div id="menu">
    <div id="menu-table">
      <div id="lobby-title"></div>
      <div id="seats"></div>
    </div>
    <div id="menu-main">
      <div id="menu-frame">
        <img id="menu-plate" alt="">
        <video id="menu-video" muted loop playsinline preload="auto"></video>
      </div>
      <div id="menu-info">
        <div id="menu-title"></div>
        <div id="menu-meta"></div>
        <p id="menu-about"></p>
        <p id="lobby-hint"></p>
      </div>
    </div>
    <div id="menu-tiles"></div>
  </div>
</div>
<div id="battleship" class="screen"></div>
<div id="siege" class="screen"></div>
<div id="submarine" class="screen"></div>
<div id="crowd" class="screen"></div>
<div id="dice" class="screen"></div>
<div id="artillery" class="screen"></div>
<div id="ram" class="screen"></div>
<div id="carpet" class="screen"></div>
<div id="rockets" class="screen"></div>
<div id="recall" class="screen"></div>
<div id="curtain"><div id="curtain-name"></div></div>
<div id="finale-bars"><i></i><i></i></div>
<div id="cannon">
  <div class="cannon-aim"><div class="cannon-gun"><i class="cannon-flash"></i></div></div>
  <div class="cannon-base"></div>
</div>
<script src="engine.js?v=20261104103100"></script>
<script src="qrcode.js?v=20261104103100"></script>

<script src="sound.js?v=20261104103100"></script>

<script src="battleship.js?v=20261104103100"></script>
<script src="siege.js?v=20261104103100"></script>
<script src="submarine.js?v=20261104103100"></script>
<script src="crowd.js?v=20261104103100"></script>
<script src="dice.js?v=20261104103100"></script>
<script src="artillery.js?v=20261104103100"></script>
<script src="doodle.js?v=20261104103100"></script>
<script src="posters.js?v=20261104103100"></script>
<script src="menu.js?v=20261104103100"></script>
<script src="main.js?v=20261104103100"></script>
</body>
</html>
